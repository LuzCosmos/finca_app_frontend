<!DOCTYPE html>
<html>

<head>
  <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.
    -->
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Application to manage a farm">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="finca_app_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>finca_app_frontend</title>

  <!-- Web app manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Runtime environment variables (generated by docker-entrypoint.sh)
       MUST be loaded BEFORE Flutter bootstrap -->
  <script src="env-config.js"></script>
</head>

<body>
  <!-- Complete service worker cleanup and Flutter bootstrap -->
  <script>
    (async () => {
      console.log('[FincaApp] Starting cleanup and initialization...');

      // 1. Unregister ALL service workers (cleanup old versions)
      if ('serviceWorker' in navigator) {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          console.log(`[FincaApp] Found ${regs.length} service worker(s), unregistering...`);
          await Promise.all(regs.map(r => r.unregister()));
          console.log('[FincaApp] All service workers unregistered');
        } catch (err) {
          console.warn('[FincaApp] Error unregistering service workers:', err);
        }
      }

      // 2. Clear all caches (force fresh start)
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          console.log(`[FincaApp] Found ${keys.length} cache(s), clearing...`);
          await Promise.all(keys.map(k => caches.delete(k)));
          console.log('[FincaApp] All caches cleared');
        } catch (err) {
          console.warn('[FincaApp] Error clearing caches:', err);
        }
      }

      // 3. Load Flutter bootstrap WITHOUT service worker
      console.log('[FincaApp] Loading Flutter (no service worker)...');
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      script.onerror = () => console.error('[FincaApp] Failed to load flutter_bootstrap.js');
      script.onload = () => console.log('[FincaApp] Flutter bootstrap loaded successfully');
      document.body.appendChild(script);
    })();
  </script>
</body>

</html>
