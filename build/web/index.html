  <!-- Flutter bootstrap with service worker cache busting -->
  <script>
    (async () => {
      // 1. Unregister all existing service workers (cleanup old versions)
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
        console.log('[FincaApp] Unregistered', regs.length, 'service worker(s)');
      }

      // 2. Clear all caches (force fresh start)
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
        console.log('[FincaApp] Cleared', keys.length, 'cache(s)');
      }

      // 3. Register the new Flutter service worker
      if ('serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.register(
            'flutter_service_worker.js',
            { scope: '/' }
          );

          // Force immediate activation of new service worker
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'skipWaiting' });
          }

          // Listen for service worker updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'activated') {
                  console.log('[FincaApp] New service worker activated, reloading...');
                  window.location.reload();
                }
              });
            }
          });

          console.log('[FincaApp] Service worker registered successfully');
        } catch (err) {
          console.warn('[FincaApp] Service worker registration failed:', err);
        }
      }

      // 4. Load Flutter bootstrap
      const s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      document.body.appendChild(s);
    })();
  </script>
