name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - '**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      # Fase 3 §5.6: home_page_web_test.dart usa kIsWeb; en VM los casos van en skip — ejecutarlos en Chrome en CI.
      - name: Setup Chrome (widget tests web)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Run web-only HomePage widget tests (Chrome)
        # Primera compilación web puede superar el timeout por defecto (~12m); 30m reduce falsos negativos en CI.
        run: flutter test --platform chrome --timeout=30m test/modules/shared/features/home/home_page_web_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          # Replace with your registry handles (e.g. GHCR, DockerHub)
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo URL
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/finca-frontend:latest
            ghcr.io/${{ env.REPO_LC }}/finca-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
