name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - '**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Linux deps (integration_test en runner ubuntu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev clang liblzma-dev xvfb

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Coverage gate (lcov)
        env:
          # Umbral inicial conservador; subir por fases según §1.1 / §5.6 del plan.
          # Nota: ajustar si el baseline real cambia (ver `coverage/lcov.info`).
          MIN_LINE_COVERAGE_PCT: '20'
        run: python3 scripts/check-coverage-min.py --min "$MIN_LINE_COVERAGE_PCT" --lcov coverage/lcov.info

      # §5.6 Fase 4: integration_test no corre en `chrome`/web; en GHA usar `linux` + display virtual.
      - name: Run integration tests (Linux, headless)
        # Un solo entrypoint: varios `.dart` en `integration_test/` relanzan el runner
        # y en macOS/Linux pueden fallar el segundo attach al VM service.
        run: xvfb-run -a flutter test integration_test/all_integration_tests.dart -d linux --timeout=30m

      # Fase 3 §5.6: home_page_web_test.dart usa kIsWeb; en VM los casos van en skip — ejecutarlos en Chrome en CI.
      - name: Setup Chrome (widget tests web)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Run web-only HomePage widget tests (Chrome)
        # `--timeout` no cubre la fase "loading" del suite (~12m); `--ignore-timeouts` evita abortar en la 1.ª compilación web.
        timeout-minutes: 45
        run: flutter test --platform chrome --ignore-timeouts test/modules/shared/features/home/home_page_web_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          # Replace with your registry handles (e.g. GHCR, DockerHub)
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo URL
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/finca-frontend:latest
            ghcr.io/${{ env.REPO_LC }}/finca-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
