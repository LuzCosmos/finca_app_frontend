events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ✅ NO cache para runtime env (tiene que ganar sobre el regex de assets)
        location = /env-config.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires 0;
            try_files $uri =404;
        }

        # ✅ NO cache para los entrypoints de Flutter (necesario para ver cambios en deployments)
        location = /flutter_bootstrap.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires 0;
            try_files $uri =404;
        }

        location = /main.dart.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires 0;
            try_files $uri =404;
        }

        # Disable cache for index.html
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires 0;
        }

        location = /flutter_service_worker.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires 0;
            try_files $uri =404;
        }

        #location = /manifest.json {
        #    return 404;
        #}

        # Flutter web routing (history API fallback)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # Cache static assets
        location ~* \.(js|css)$ {
            expires 0;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Prevent serving index.html for missing source maps
        location ~ \.map$ {
            return 404;
        }

        location /api/ {
            # Resolver is needed when using variables for proxy_pass to force DNS resolution at runtime
            resolver 127.0.0.11 valid=30s;
            set $backend_upstream {{BACKEND_URL}};
            
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward real IP headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }
}
